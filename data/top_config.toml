[[blocks]]
name = "gpio_board"
memory_start = 0x80000000
memory_size  = 0x00000020
instances = 1
ios = [
  { name = "gpo", type = "output", length = 8  },
  { name = "gpi", type = "input", length = 17 },
]
xbar = { pipeline = "true", req_fifo_pass = "false", rsp_fifo_pass = "false" }

[[blocks]]
name = "gpio_rph"
memory_start = 0x80000020
memory_size  = 0x00000020
instances = 1
ios = [{name = "gpio", type = "inout", combine = "mux", length = 28}]
xbar = { pipeline = "true", req_fifo_pass = "false", rsp_fifo_pass = "false" }

[[blocks]]
name = "gpio_ah"
memory_start = 0x80000040
memory_size  = 0x00000020
instances = 1
ios = [{name = "gpio", type = "inout", combine = "mux", length = 14}]
xbar = { pipeline = "true", req_fifo_pass = "false", rsp_fifo_pass = "false" }

[[blocks]]
name = "gpio_pmod0"
memory_start = 0x80000060
memory_size  = 0x00000020
instances = 1
ios = [{name = "gpio", type = "inout", combine = "mux", length = 8}]
xbar = { pipeline = "true", req_fifo_pass = "false", rsp_fifo_pass = "false" }

[[blocks]]
name = "gpio_pmod1"
memory_start = 0x80000080
memory_size  = 0x00000020
instances = 1
ios = [{name = "gpio", type = "inout", combine = "mux", length = 8}]
xbar = { pipeline = "true", req_fifo_pass = "false", rsp_fifo_pass = "false" }

[[blocks]]
name = "pwm"
instances = 1
ios = [{ name = "pwm", type = "output", length = 7 }]
memory_start = 0x80001000
memory_size  = 0x00001000
xbar = { pipeline = "true", req_fifo_pass = "false", rsp_fifo_pass = "false" }

[[blocks]]
name = "uart"
instances = 3
ios = [
  { name = "rx", type = "input", default = 1 },
  { name = "tx", type = "output" },
]
memory_start = 0x80100000
memory_size  = 0x00001000
xbar = { pipeline = "true", req_fifo_pass = "false", rsp_fifo_pass = "false" }

[[blocks]]
name = "i2c"
instances = 2
ios = [
  { name = "scl", type = "inout", combine = "and" },
  { name = "sda", type = "inout", combine = "and" },
]
memory_start = 0x80200000
memory_size  = 0x00001000
xbar = { pipeline = "true", req_fifo_pass = "false", rsp_fifo_pass = "false" }

[[blocks]]
name = "spi"
instances = 4
ios = [
  { name = "cipo", type = "input", default = 0 },
  { name = "copi", type = "output" },
  { name = "sclk", type = "output" },
  { name = "cs", type = "output", length = 4 },
]
memory_start = 0x80300000
memory_size  = 0x00001000

